<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f6b2f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cruce Paltas">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Cruce Calidad Paltas ACQ</title>
<style>
  :root{
    --verde:#2f6b2f; --verde2:#4c8c3a; --palta:#a7c957; --fondo:#f3f5ef; --borde:#d6dccd;
    --texto:#1d261b; --suave:#5f6b5a; --rojo:#b3261e; --ambar:#8a6100;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--fondo);color:var(--texto);font-size:16px}
  header{position:sticky;top:0;z-index:5;background:var(--verde);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;display:flex;align-items:center;gap:10px}
  header h1{font-size:17px;margin:0;flex:1;line-height:1.2}
  header h1 small{display:block;font-weight:400;font-size:12px;opacity:.85}
  .net{font-size:12px;font-weight:700;border-radius:12px;padding:3px 9px;background:#fff;color:var(--verde);white-space:nowrap}
  .net.off{color:var(--ambar)}
  .icono{background:none;border:0;color:#fff;font-size:22px;padding:4px 6px;cursor:pointer}
  main{max-width:560px;margin:0 auto;padding:12px 12px 120px}
  .card{background:#fff;border:1px solid var(--borde);border-radius:14px;padding:12px 14px;margin-bottom:12px}
  .card h2{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--suave);margin:0 0 10px}
  label.lbl{display:block;font-size:14px;font-weight:600;margin:10px 0 6px}
  label.lbl:first-of-type{margin-top:0}
  input[type=text],textarea{width:100%;font:inherit;padding:11px 12px;border:1px solid var(--borde);border-radius:10px;background:#fff}
  textarea{min-height:64px;resize:vertical}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:1.5px solid var(--borde);background:#fff;border-radius:22px;padding:9px 14px;font:inherit;font-size:15px;cursor:pointer;color:var(--texto)}
  .chip.sel{background:var(--verde);border-color:var(--verde);color:#fff;font-weight:600}
  .chips.err .chip{border-color:var(--rojo)}
  .otroInp{flex:1 1 100%;width:100%;font:inherit;padding:10px 12px;border:1.5px solid var(--verde);border-radius:10px}
  .fila{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #eef1ea}
  .fila:last-child{border-bottom:0}
  .fila .nom{flex:1;font-weight:600;font-size:15px}
  .fila .nom small{display:block;font-weight:400;color:var(--suave);font-size:12px}
  .step{display:flex;align-items:center;gap:6px}
  .step button{width:44px;height:44px;border-radius:10px;border:1px solid var(--borde);background:#f7f9f4;font-size:22px;font-weight:700;color:var(--verde);cursor:pointer}
  .step input{width:64px;height:44px;text-align:center;font:inherit;font-size:18px;font-weight:700;border:1px solid var(--borde);border-radius:10px}
  .total{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding:10px 12px;background:#f0f5e8;border-radius:10px;font-weight:700}
  .total span:last-child{font-size:20px;color:var(--verde)}
  .barra{display:flex;height:10px;border-radius:6px;overflow:hidden;margin-top:8px;background:#e7ebe2}
  .barra div{height:100%}
  .leyenda{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--suave);margin-top:6px}
  .leyenda i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px}
  .pie{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--borde);padding:10px 12px calc(env(safe-area-inset-bottom) + 10px);z-index:5}
  .pie .in{max-width:560px;margin:0 auto;display:flex;gap:10px}
  .btn{flex:1;border:0;border-radius:12px;padding:14px;font:inherit;font-size:16px;font-weight:700;cursor:pointer}
  .btn.pri{background:var(--verde);color:#fff}
  .btn.sec{background:#eef2e8;color:var(--verde);flex:0 0 auto;padding:14px 16px}
  .msg{font-size:13px;color:var(--rojo);margin-top:6px;min-height:0}
  .pend{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .pend b{font-size:22px}
  .lista{margin-top:8px;font-size:13px}
  .lista .it{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-top:1px solid #eef1ea}
  .lista .it span:last-child{color:var(--suave);white-space:nowrap}
  .ok{color:var(--verde2)!important;font-weight:600}
  .wait{color:var(--ambar)!important;font-weight:600}
  .toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:#1d261b;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9;max-width:90%;text-align:center}
  .toast.show{opacity:1}
  dialog{border:0;border-radius:16px;padding:18px;width:min(92vw,460px)}
  dialog::backdrop{background:rgba(0,0,0,.4)}
  dialog h3{margin:0 0 10px}
  .ayuda{font-size:12px;color:var(--suave);margin-top:4px}
  .hidden{display:none}
</style>
</head>
<body>
<header>
  <h1>Cruce Calidad Paltas<small>ACQ · registro sin conexión</small></h1>
  <span id="net" class="net">…</span>
  <button class="icono" id="btnCfg" aria-label="Configuración">⚙︎</button>
</header>

<main>
  <div class="card">
    <h2>Muestra</h2>
    <label class="lbl">Nombre</label>
    <div class="chips" data-campo="nombre"></div>

    <label class="lbl">Línea salida</label>
    <div class="chips" data-campo="linea"></div>

    <label class="lbl">Tipo muestra</label>
    <div class="chips" data-campo="tipo"></div>

    <label class="lbl">Categoría</label>
    <div class="chips" data-campo="categoria"></div>

    <label class="lbl" for="calibre">Calibre <span style="font-weight:400;color:var(--suave)">(opcional)</span></label>
    <input type="text" id="calibre" autocomplete="off" placeholder="Ej: 50 (USA) o 18 (Europa)">
  </div>

  <div class="card">
    <h2>Cantidades</h2>
    <div id="cantidades"></div>
    <div class="total"><span>COUNT (total frutos)</span><span id="count">0</span></div>
    <div class="barra" id="barra"></div>
    <div class="leyenda" id="leyenda"></div>
  </div>

  <div class="card">
    <h2>Comentario</h2>
    <textarea id="comentario" placeholder="Opcional"></textarea>
    <div class="msg" id="msg"></div>
  </div>

  <div class="card">
    <div class="pend">
      <div>Pendientes de enviar: <b id="nPend">0</b></div>
      <button class="btn sec" id="btnSync">Enviar ahora</button>
    </div>
    <div class="ayuda" id="ultSync"></div>
    <div class="lista" id="lista"></div>
  </div>
</main>

<div class="pie"><div class="in">
  <button class="btn sec" id="btnLimpiar">Limpiar</button>
  <button class="btn pri" id="btnGuardar">Guardar muestra</button>
</div></div>

<div class="toast" id="toast"></div>

<dialog id="dlgCfg">
  <h3>Configuración</h3>
  <label class="lbl" for="cfgUrl">URL de la aplicación web (Apps Script)</label>
  <input type="text" id="cfgUrl" placeholder="https://script.google.com/macros/s/.../exec">
  <label class="lbl" for="cfgClave">Clave</label>
  <input type="text" id="cfgClave" placeholder="La misma CLAVE del script">
  <div class="ayuda">Se guardan solo en este teléfono.</div>
  <div class="pie" style="position:static;border:0;padding:14px 0 0"><div class="in">
    <button class="btn sec" id="cfgCancel">Cerrar</button>
    <button class="btn pri" id="cfgSave">Guardar</button>
  </div></div>
</dialog>

<script>
/* ========= OPCIONES (edítalas aquí si cambian) ========= */
const URL_SCRIPT_POR_DEFECTO = "https://script.google.com/macros/s/AKfycbzQ6ZtOa4AuGaZRXMAwsO5cnzcwUR3lZH5KiH0Qq8kel8V-757wY6z19S7cRncP5Kn8ug/exec";   // pega aquí la URL /exec para no tener que configurarla en cada teléfono
const CLAVE_POR_DEFECTO      = "cambia-esta-clave";   // la misma CLAVE que pusiste en el script

const OPCIONES = {
  nombre:    ["Marcelo Sánchez"],
  linea:     ["Compac 2", "Compac 4", "Compac 5", "DLS", "Trypack", "SLS", "G1", "G2"],
  tipo:      ["Producto Terminado", "Peso Inicial", "Bins Descarte", "Bins Precalibrado", "Rebalse"],
  categoria: ["CAT 1", "CAT 1 NEGRA", "CAT 2", "DESCARTE"]
};
const CANTIDADES = [
  {id:"cat1",     nom:"Cantidad CAT 1",       color:"#2f6b2f"},
  {id:"cat1n",    nom:"Cantidad CAT 1 negra", color:"#1d261b"},
  {id:"cat2",     nom:"Cantidad CAT 2",       color:"#a7c957"},
  {id:"descarte", nom:"Cantidad descarte",    color:"#b3261e"}
];

/* ========= Almacenamiento local ========= */
const K = {cola:"cpa_cola", hist:"cpa_hist", cfg:"cpa_cfg", nombres:"cpa_nombres", ultimo:"cpa_ultimo"};
const leer = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } };
const escribir = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch(e){ return false; } };
const cfg = () => {
  const c = leer(K.cfg, {});
  return { url: (c.url || URL_SCRIPT_POR_DEFECTO).trim(), clave: (c.clave || CLAVE_POR_DEFECTO).trim() };
};

const $ = id => document.getElementById(id);
const sel = {nombre:null, linea:null, tipo:null, categoria:null};
const CON_OTRO = {nombre:"text"};   // campos con botón "Otro" para escribir

/* ========= Construcción del formulario ========= */
function armarChips(){
  document.querySelectorAll(".chips").forEach(box => {
    const campo = box.dataset.campo;
    box.innerHTML = "";
    OPCIONES[campo].forEach(op => {
      const b = document.createElement("button");
      b.type = "button"; b.className = "chip"; b.textContent = op;
      b.onclick = () => {
        sel[campo] = sel[campo] === op ? null : op;
        box.classList.remove("err");
        pintarChips();
      };
      box.appendChild(b);
    });
    if(CON_OTRO[campo]){
      const b = document.createElement("button");
      b.type = "button"; b.className = "chip otro"; b.textContent = "Otro…";
      const inp = document.createElement("input");
      inp.type = "text"; inp.className = "otroInp hidden"; inp.id = "otro_" + campo;
      inp.setAttribute("inputmode", CON_OTRO[campo]);
      inp.placeholder = "Escribe el nombre";
      b.onclick = () => {
        const abierto = !inp.classList.contains("hidden");
        if(abierto && !inp.value.trim()){ inp.classList.add("hidden"); sel[campo] = null; }
        else { inp.classList.remove("hidden"); sel[campo] = inp.value.trim() || null; inp.focus(); }
        box.classList.remove("err"); pintarChips();
      };
      inp.addEventListener("input", () => {
        sel[campo] = inp.value.trim() || null; box.classList.remove("err"); pintarChips();
      });
      box.appendChild(b); box.appendChild(inp);
    }
  });
}
function pintarChips(){
  document.querySelectorAll(".chips").forEach(box => {
    const campo = box.dataset.campo;
    const inp = document.getElementById("otro_" + campo);
    const enLista = OPCIONES[campo].includes(sel[campo]);
    box.querySelectorAll(".chip:not(.otro)").forEach(b => b.classList.toggle("sel", b.textContent === sel[campo]));
    if(inp){
      if(enLista){ inp.value = ""; inp.classList.add("hidden"); }
      box.querySelector(".chip.otro").classList.toggle("sel", !!sel[campo] && !enLista);
    }
  });
}
function armarCantidades(){
  const c = $("cantidades"); c.innerHTML = "";
  CANTIDADES.forEach(q => {
    const f = document.createElement("div"); f.className = "fila";
    f.innerHTML = `<div class="nom">${q.nom}<small id="p_${q.id}">0%</small></div>
      <div class="step">
        <button type="button" data-d="-1" aria-label="restar">−</button>
        <input id="q_${q.id}" inputmode="numeric" pattern="[0-9]*" value="0">
        <button type="button" data-d="1" aria-label="sumar">+</button>
      </div>`;
    const inp = f.querySelector("input");
    f.querySelectorAll("button").forEach(b => b.onclick = () => {
      const v = Math.max(0, (parseInt(inp.value,10) || 0) + parseInt(b.dataset.d,10));
      inp.value = v; recalcular();
    });
    inp.addEventListener("focus", () => inp.select());
    inp.addEventListener("input", () => { inp.value = inp.value.replace(/\D/g,""); recalcular(); });
    c.appendChild(f);
  });
}
const valor = id => parseInt($("q_"+id).value,10) || 0;
function recalcular(){
  const total = CANTIDADES.reduce((s,q) => s + valor(q.id), 0);
  $("count").textContent = total;
  $("barra").innerHTML = total ? CANTIDADES.map(q => `<div style="width:${valor(q.id)/total*100}%;background:${q.color}"></div>`).join("") : "";
  CANTIDADES.forEach(q => $("p_"+q.id).textContent = total ? (valor(q.id)/total*100).toFixed(1).replace(".",",")+"%" : "0%");
  $("leyenda").innerHTML = CANTIDADES.map(q => `<span><i style="background:${q.color}"></i>${q.nom.replace("Cantidad ","")}</span>`).join("");
}

/* ========= Guardar ========= */
function fechaTexto(d){
  const p = n => String(n).padStart(2,"0");
  return `${p(d.getDate())}/${p(d.getMonth()+1)}/${d.getFullYear()} ${d.getHours()}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}
function guardar(){
  const faltan = [];
  ["nombre","linea","tipo","categoria"].forEach(c => {
    if(!sel[c]){ faltan.push(c); document.querySelector(`.chips[data-campo="${c}"]`).classList.add("err"); }
  });
  const nombre = sel.nombre;
  const total = CANTIDADES.reduce((s,q) => s + valor(q.id), 0);
  if(total === 0) faltan.push("cantidades");
  if(faltan.length){
    const nombresCampo = {nombre:"Nombre", linea:"Línea salida", tipo:"Tipo muestra", categoria:"Categoría", cantidades:"al menos una cantidad"};
    $("msg").textContent = "Falta: " + faltan.map(f => nombresCampo[f]).join(", ");
    return;
  }
  $("msg").textContent = "";
  const ahora = new Date();
  const reg = {
    id: ahora.getTime().toString(36) + "-" + Math.random().toString(36).slice(2,8),
    ts: ahora.toISOString(),
    fechaTxt: fechaTexto(ahora),
    nombre, linea: sel.linea, tipo: sel.tipo, categoria: sel.categoria, calibre: $("calibre").value.trim(),
    count: total, cat1: valor("cat1"), cat1n: valor("cat1n"), cat2: valor("cat2"), descarte: valor("descarte"),
    comentario: $("comentario").value.trim()
  };
  const cola = leer(K.cola, []); cola.push(reg);
  if(!escribir(K.cola, cola)){ toast("No se pudo guardar en el teléfono (memoria llena)"); return; }

  if(!OPCIONES.nombre.includes(nombre)){
    const noms = leer(K.nombres, []);
    if(!noms.includes(nombre)){ noms.unshift(nombre); escribir(K.nombres, noms.slice(0,10)); }
  }
  escribir(K.ultimo, {nombre, linea: sel.linea, tipo: sel.tipo, categoria: sel.categoria});

  limpiarCantidades();
  $("calibre").value = "";
  toast(navigator.onLine ? "Guardada. Enviando…" : "Guardada en el teléfono. Se enviará al volver la señal");
  pintarCola();
  sincronizar();
  window.scrollTo({top:0, behavior:"smooth"});
}
function cerrarOtro(c){ const i = document.getElementById("otro_" + c); if(i){ i.value = ""; i.classList.add("hidden"); } }
function limpiarCantidades(){
  CANTIDADES.forEach(q => $("q_"+q.id).value = 0);
  $("comentario").value = "";
  recalcular();
}

/* ========= Sincronización ========= */
let enviando = false;
async function sincronizar(manual){
  const cola = leer(K.cola, []);
  if(enviando || !cola.length){ if(manual && !cola.length) toast("No hay pendientes"); return; }
  const {url, clave} = cfg();
  if(!url){ if(manual){ toast("Falta configurar la URL del script"); $("dlgCfg").showModal(); } return; }
  if(!navigator.onLine){ if(manual) toast("Sin conexión. Se enviará al volver la señal"); return; }
  enviando = true; $("btnSync").textContent = "Enviando…";
  try{
    const lote = cola.slice(0, 50);
    const r = await fetch(url, {
      method: "POST",
      headers: {"Content-Type": "text/plain;charset=utf-8"},   // evita la verificación CORS previa
      body: JSON.stringify({clave, registros: lote})
    });
    const j = await r.json();
    if(!j.ok) throw new Error(j.error || "Error del script");
    const ok = new Set(j.guardados || []);
    const resto = leer(K.cola, []).filter(x => !ok.has(x.id));
    escribir(K.cola, resto);
    const hist = leer(K.hist, []);
    lote.filter(x => ok.has(x.id)).forEach(x => hist.unshift({...x, enviado: new Date().toISOString()}));
    escribir(K.hist, hist.slice(0, 30));
    localStorage.setItem("cpa_ultSync", new Date().toISOString());
    if(manual || ok.size) toast(`${ok.size} muestra${ok.size===1?"":"s"} enviada${ok.size===1?"":"s"} a la planilla`);
    enviando = false; $("btnSync").textContent = "Enviar ahora";
    pintarCola();
    if(resto.length && ok.size) sincronizar();
    return;
  }catch(e){
    if(manual) toast("No se pudo enviar: " + (e.message || "sin respuesta") + ". Quedan guardadas.");
  }
  enviando = false; $("btnSync").textContent = "Enviar ahora";
  pintarCola();
}

function pintarCola(){
  const cola = leer(K.cola, []), hist = leer(K.hist, []);
  $("nPend").textContent = cola.length;
  const u = localStorage.getItem("cpa_ultSync");
  $("ultSync").textContent = u ? "Último envío: " + fechaTexto(new Date(u)) : "";
  const filas = [
    ...cola.slice().reverse().map(x => ({x, est:'<span class="wait">pendiente</span>'})),
    ...hist.slice(0, 8).map(x => ({x, est:'<span class="ok">enviada</span>'}))
  ];
  $("lista").innerHTML = filas.map(({x,est}) =>
    `<div class="it"><span>${x.fechaTxt.slice(0,-3)} · ${x.linea} · ${x.tipo} ${x.calibre ? "· cal " + x.calibre + " " : ""}· ${x.count} fr</span>${est}</div>`).join("");
}

function estadoRed(){
  const n = $("net");
  if(navigator.onLine){ n.textContent = "En línea"; n.classList.remove("off"); }
  else { n.textContent = "Sin conexión"; n.classList.add("off"); }
}

let tt;
function toast(t){ const e=$("toast"); e.textContent=t; e.classList.add("show"); clearTimeout(tt); tt=setTimeout(()=>e.classList.remove("show"), 3200); }

/* ========= Configuración ========= */
$("btnCfg").onclick = () => { const c = cfg(); $("cfgUrl").value = c.url; $("cfgClave").value = c.clave; $("dlgCfg").showModal(); };
$("cfgCancel").onclick = () => $("dlgCfg").close();
$("cfgSave").onclick = () => {
  const url = $("cfgUrl").value.trim();
  if(url && !/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(url)){ toast("La URL debe terminar en /exec"); return; }
  escribir(K.cfg, {url, clave: $("cfgClave").value.trim()});
  $("dlgCfg").close(); toast("Configuración guardada"); sincronizar();
};

/* ========= Inicio ========= */
armarChips(); armarCantidades(); recalcular();
(() => {
  // nombres escritos con "Otro" quedan como botones en este teléfono
  leer(K.nombres, []).forEach(n => { if(!OPCIONES.nombre.includes(n)) OPCIONES.nombre.push(n); });
  armarChips();
  const u = leer(K.ultimo, null);
  if(u){ ["nombre","linea","tipo","categoria"].forEach(c => { if(OPCIONES[c].includes(u[c])) sel[c] = u[c]; }); }
  if(!sel.nombre && OPCIONES.nombre.length === 1) sel.nombre = OPCIONES.nombre[0];
  pintarChips();
})();
$("btnGuardar").onclick = guardar;
$("btnLimpiar").onclick = () => { limpiarCantidades(); $("calibre").value = ""; $("msg").textContent = ""; };
$("btnSync").onclick = () => sincronizar(true);
window.addEventListener("online", () => { estadoRed(); sincronizar(); });
window.addEventListener("offline", estadoRed);
document.addEventListener("visibilitychange", () => { if(!document.hidden) sincronizar(); });
setInterval(sincronizar, 60000);
estadoRed(); pintarCola(); sincronizar();

if("serviceWorker" in navigator && location.protocol === "https:"){
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}
</script>
</body>
</html>
